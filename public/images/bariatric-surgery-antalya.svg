<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560">
  <defs>
    <linearGradient id="bariBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#172F36" />
      <stop offset="50%" stop-color="#246476" />
      <stop offset="100%" stop-color="#1C3D38" />
    </linearGradient>
    <linearGradient id="bariCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.97" />
      <stop offset="100%" stop-color="#F0EBD8" stop-opacity="0.97" />
    </linearGradient>
    <linearGradient id="stomachFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#36B729" />
      <stop offset="100%" stop-color="#246476" />
    </linearGradient>
  </defs>

  <rect width="800" height="560" fill="url(#bariBg)" />

  <!-- Subtle Medical Grid -->
  <g stroke="#89CDDF" stroke-opacity="0.08" stroke-width="1">
    <line x1="0" y1="80" x2="800" y2="80" />
    <line x1="0" y1="160" x2="800" y2="160" />
    <line x1="0" y1="240" x2="800" y2="240" />
    <line x1="0" y1="320" x2="800" y2="320" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="0" y1="480" x2="800" y2="480" />
    <line x1="160" y1="0" x2="160" y2="560" />
    <line x1="320" y1="0" x2="320" y2="560" />
    <line x1="480" y1="0" x2="480" y2="560" />
    <line x1="640" y1="0" x2="640" y2="560" />
  </g>

  <circle cx="240" cy="250" r="190" fill="#36B729" fill-opacity="0.16" />
  <circle cx="560" cy="260" r="180" fill="#89CDDF" fill-opacity="0.14" />

  <!-- Left Card: Laparoscopic Gastric Sleeve & Metabolic Diagram -->
  <g transform="translate(75, 70)">
    <rect x="0" y="0" width="310" height="370" rx="28" fill="url(#bariCard)" stroke="#36B729" stroke-width="3" />

    <rect x="20" y="18" width="270" height="32" rx="16" fill="#36B729" fill-opacity="0.15" />
    <text x="155" y="39" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="13" fill="#2B9620">
      LAPAROSCOPIC GASTRIC SLEEVE
    </text>

    <!-- Stylized Stomach Sleeve vs Resected Fundus Schematic -->
    <g transform="translate(55, 65)">
      <!-- Original Outer Fundus Contour (Dashed) -->
      <path d="M85,20 C145,20 185,68 180,130 C175,180 135,212 75,210" fill="#F43F5E" fill-opacity="0.12" stroke="#E11D48" stroke-width="2.5" stroke-dasharray="6,4" />

      <!-- New Narrow Sleeve Pouch (Active Green/Teal) -->
      <path d="M68,10 L86,10 C98,55 105,125 85,205 L62,205 C78,130 75,60 68,10 Z" fill="url(#stomachFill)" stroke="#2D332F" stroke-width="2.5" />

      <!-- Stapler Triple-Line Marker -->
      <path d="M86,15 C100,65 104,130 85,200" fill="none" stroke="#36B729" stroke-width="3" stroke-dasharray="4,4" />

      <text x="135" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="11" fill="#9F1239">
        -80% Volume
      </text>
      <text x="135" y="122" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2D332F">
        Ghrelin Reduced
      </text>
    </g>

    <rect x="22" y="295" width="266" height="54" rx="14" fill="#2D332F" />
    <text x="155" y="317" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="13" fill="#36B729">
      US COVIDIEN / ETHICON STAPLERS
    </text>
    <text x="155" y="336" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#CEE7ED">
      65–80% Excess Weight Loss • 3 Nights ICU Hospital
    </text>
  </g>

  <!-- Right Card: All-Inclusive Bariatric Care & Specialist Team -->
  <g transform="translate(415, 70)">
    <rect x="0" y="0" width="310" height="370" rx="28" fill="url(#bariCard)" stroke="#378AA0" stroke-width="3" />

    <rect x="20" y="18" width="270" height="32" rx="16" fill="#378AA0" fill-opacity="0.15" />
    <text x="155" y="39" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="13" fill="#246476">
      SLEEVE • BYPASS • BALLOON
    </text>

    <!-- Procedures Badges List -->
    <g transform="translate(24, 66)">
      <rect x="0" y="0" width="262" height="44" rx="12" fill="#FFFFFF" stroke="#36B729" stroke-width="2" />
      <text x="16" y="27" font-family="Arial, sans-serif" font-weight="bold" font-size="13" fill="#2D332F">
        ✓ Gastric Sleeve &amp; Single-Port
      </text>

      <rect x="0" y="54" width="262" height="44" rx="12" fill="#FFFFFF" stroke="#378AA0" stroke-width="2" />
      <text x="16" y="81" font-family="Arial, sans-serif" font-weight="bold" font-size="13" fill="#2D332F">
        ✓ Roux-en-Y &amp; Mini Gastric Bypass
      </text>

      <rect x="0" y="108" width="262" height="44" rx="12" fill="#FFFFFF" stroke="#378AA0" stroke-width="2" />
      <text x="16" y="135" font-family="Arial, sans-serif" font-weight="bold" font-size="13" fill="#2D332F">
        ✓ Allurion &amp; Endoscopic Balloon
      </text>

      <rect x="0" y="162" width="262" height="44" rx="12" fill="#FFFFFF" stroke="#36B729" stroke-width="2" />
      <text x="16" y="189" font-family="Arial, sans-serif" font-weight="bold" font-size="13" fill="#2D332F">
        ✓ Revision Bariatric Surgery
      </text>
    </g>

    <rect x="22" y="295" width="266" height="54" rx="14" fill="#378AA0" />
    <text x="155" y="317" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="12" fill="#FFFFFF">
      Prof. Dr. Burhan Mayir • Dr. Direnç Yiğit
    </text>
    <text x="155" y="336" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="11" fill="#F0EBD8">
      Op. Dr. Mehmet Altan Kaya • 1-Yr Dietitian
    </text>
  </g>
</svg>
